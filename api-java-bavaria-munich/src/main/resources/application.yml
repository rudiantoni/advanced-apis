server:
  port: 8080
  servlet:
    context-path: /api
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/adv_pg_db
    username: adv_pg_user
    password: adv_pg_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
app:
  security:
    jwt-secret: "DCQPKB8ErtHUYHCqJZUKzgq9l733y/pNLhib8Xin8Yw="
    jwt-expiration-ms: 3600000 # 3600000ms = 1hr
    public-routes: >-
      [
        {"route":"^/swagger-ui(/.*)?$"},
        {"route":"^/swagger-ui\\.html$"},
        {"route":"^/v3/api-docs(/.*)?$"},
        {"route":"^/open(/.*)?$"},
        {"route":"^/auth/login$"},
        {"route":"^/users$","methods":["POST"]}
      ]
    # public-routes: "[{\"route\":\"^/swagger-ui(/.*)?$\"},{\"route\":\"^/swagger-ui\\\\.html$\"},{\"route\":\"^/v3/api-docs(/.*)?$\"},{\"route\":\"^/open(/.*)?$\"},{\"route\":\"^/auth/login$\"},{\"route\":\"^/users$\",\"methods\":[\"POST\"]}]"

logging:
  level:
    root: INFO
